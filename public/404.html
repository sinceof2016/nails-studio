<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Pelu SPA · Redireccionando...</title>
    <script>
      // Single Page Application redirect script for GitHub Pages
      // Auto-detect project pages (e.g. /nails-studio/) vs root pages
      const l = window.location;
      const isGitHubIo = l.hostname.endsWith('github.io');
      const pathSegmentsToKeep = (isGitHubIo && l.pathname.split('/').filter(Boolean).length > 0) ? 1 : 0;
      
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redireccionando a La Pelu SPA...</p>
  </body>
</html>
