<!doctype html>
<html lang="es" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>La Pelu SPA - Salón &amp; Santuario de Bienestar</title>
    <meta name="description" content="Salón de belleza, spa relajante, manicura rusa y nail art en un santuario de autocuidado y bienestar." />
    <meta property="og:title" content="La Pelu SPA - Salón &amp; Santuario de Bienestar" />
    <meta property="og:description" content="Salón de belleza, spa relajante, manicura rusa y nail art en un santuario de autocuidado y bienestar." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#BB9C87" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,300..700;1,6..12,300..700&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/app.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
  </head>
  <body class="bg-[#F4EFE9] text-[#2B2420] font-['Nunito_Sans',sans-serif] antialiased min-h-screen selection:bg-[#BB9C87] selection:text-[#2B2420]">
    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <div id="root"></div>
    <!-- Entry point principal para desarrollo Vite y compilación -->

    <!-- Fallback automático para despliegues estáticos directos en GitHub Pages -->
    <script>
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          var rootEl = document.getElementById('root');
          if (rootEl && !rootEl.hasChildNodes()) {
            console.info('Activando bundle compilado para GitHub Pages...');
            if (!document.querySelector('link[href*="index.css"]')) {
              var link = document.createElement('link');
              link.rel = 'stylesheet';
              link.href = './assets/index.css';
              document.head.appendChild(link);
            }
            var script = document.createElement('script');
            script.type = 'module';
            script.crossOrigin = 'anonymous';
            script.src = './assets/app.js';
            document.body.appendChild(script);
          }
        }, 200);
      });
    </script>
  </body>
</html>
