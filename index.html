  <body class="bg-[#F4EFE9] text-[#2B2420] font-['Nunito_Sans',sans-serif] antialiased min-h-screen selection:bg-[#BB9C87] selection:text-[#2B2420]">
    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <div id="root"></div>
    <!-- Entry point principal para desarrollo Vite y compilación -->
    <script type="module" src="./src/main.tsx"></script>

    <!-- Fallback automático para despliegues estáticos directos en GitHub Pages -->
    <script>
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          var rootEl = document.getElementById('root');
          if (rootEl && !rootEl.hasChildNodes()) {
            console.info('Activando bundle compilado para GitHub Pages...');
            if (!document.querySelector('link[href*="index.css"]')) {
              var link = document.createElement('link');
              link.rel = 'stylesheet';
              link.href = './assets/index.css';
              document.head.appendChild(link);
            }
            var script = document.createElement('script');
            script.type = 'module';
            script.crossOrigin = 'anonymous';
            script.src = './assets/app.js';
            document.body.appendChild(script);
          }
        }, 200);
      });
    </script>
  </body>
</html>
